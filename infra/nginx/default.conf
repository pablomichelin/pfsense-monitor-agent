upstream monitor_api {
  server api:8088;
  keepalive 32;
}

upstream monitor_web {
  server web:3000;
  keepalive 32;
}

server {
  listen 8088;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  # D2: cabecalhos de seguranca (05-seguranca). HSTS chega ao cliente via TLS no edge.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    proxy_pass http://monitor_api;
  }

  # Limite maior somente na rota de backup de config.xml (heartbeat permanece em 64 KB na API)
  location = /api/v1/ingest/config-backup {
    client_max_body_size 5m;
    proxy_pass http://monitor_api;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location ^~ /api/v1/ {
    proxy_pass http://monitor_api;
  }

  location = /api/realtime/dashboard {
    proxy_pass http://monitor_web;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no always;
    # D2: re-declara cabecalhos de seguranca (add_header da location nao herda os do server).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  }

  location / {
    proxy_pass http://monitor_web;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
