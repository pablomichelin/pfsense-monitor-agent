# Docker DNS: proxy_pass com variável + hostname (não upstream estático).
# Recreate de api/web muda o IP; resolver 127.0.0.11 evita 502 com IP stale.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8088;
  server_name _;

  proxy_http_version 1.1;
  # $http_host preserves non-default ports (8088); $host strips them and breaks Next.js Server Actions.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  # D2: cabecalhos de seguranca (05-seguranca). HSTS chega ao cliente via TLS no edge.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    set $api_upstream http://api:8088;
    proxy_pass $api_upstream;
  }

  # Limite maior somente na rota de backup de config.xml (heartbeat permanece em 64 KB na API)
  location = /api/v1/ingest/config-backup {
    client_max_body_size 5m;
    set $api_upstream http://api:8088;
    proxy_pass $api_upstream;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location ^~ /api/v1/ {
    set $api_upstream http://api:8088;
    proxy_pass $api_upstream;
  }

  location = /api/realtime/dashboard {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no always;
    # D2: re-declara cabecalhos de seguranca (add_header da location nao herda os do server).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  }

  location / {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
