server {
  listen 80;
  listen [::]:80;
  server_name pfs-monitor.systemup.inf.br;

  client_max_body_size 64k;
  proxy_http_version 1.1;

  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  proxy_set_header CF-Ray $http_cf_ray;
  proxy_set_header Connection "";

  # D2: cabecalhos de seguranca (05-seguranca) aplicados no edge de proxy.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  # Origem canonica: host do compose em 192.168.100.221, porta publicada 3031 -> gateway interno 8088
  set $monitor_origin "http://192.168.100.221:3031";

  location = /healthz {
    proxy_pass $monitor_origin;
    add_header Cache-Control "no-store" always;
    # D2: re-declara (location com add_header nao herda os do server).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /api/realtime/dashboard {
    proxy_pass $monitor_origin;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Accel-Buffering "no" always;
    # D2: re-declara cabecalhos de seguranca (mantendo buffering off para SSE).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  }

  # Limite maior somente na rota de backup de config.xml
  location = /api/v1/ingest/config-backup {
    client_max_body_size 5m;
    proxy_pass $monitor_origin;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location / {
    proxy_pass $monitor_origin;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
