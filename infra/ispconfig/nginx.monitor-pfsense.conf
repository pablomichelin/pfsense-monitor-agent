server {
  listen 80;
  listen [::]:80;
  server_name pfs-monitor.systemup.inf.br;

  client_max_body_size 64k;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  proxy_set_header CF-Ray $http_cf_ray;
  proxy_set_header Connection "";

  # Origem canonica: host do compose em 192.168.100.221, porta publicada 3031 -> gateway interno 8088
  set $monitor_origin "http://192.168.100.221:3031";

  location = /healthz {
    proxy_pass $monitor_origin;
    add_header Cache-Control "no-store" always;
  }

  location = /api/realtime/dashboard {
    proxy_pass $monitor_origin;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Accel-Buffering "no" always;
  }

  # Limite maior somente na rota de backup de config.xml
  location = /api/v1/ingest/config-backup {
    client_max_body_size 5m;
    proxy_pass $monitor_origin;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location / {
    proxy_pass $monitor_origin;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
